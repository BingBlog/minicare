<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#4CAF82" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 月牙主体 -->
  <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="#4CAF82" fill-opacity="0.25"/>
  <!-- 鼻子：月牙亮面中部，小圆点 -->
  <circle cx="9.5" cy="12.5" r="0.7" fill="#4CAF82" stroke="none"/>
  <!-- 嘴：鼻子下方微笑弧 -->
  <path d="M8 14.5 Q9.5 16 11 14.5" stroke="#4CAF82" stroke-width="1.3" fill="none" stroke-linecap="round"/>
  <!-- 小 z -->
  <path d="M15 9.5 L16.2 9.5 L15 8.2 L16.2 8.2" stroke="#4CAF82" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 中 z -->
  <path d="M16.5 7.8 L18 7.8 L16.5 6.2 L18 6.2" stroke="#4CAF82" stroke-width="1.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 大 Z -->
  <path d="M18.2 6 L20 6 L18.2 4 L20 4" stroke="#4CAF82" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
