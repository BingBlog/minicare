# 本地 Langfuse v3（TECH-007，本地评估用途，非生产部署）
#
# 启动：docker compose up -d        （首次需先启动 Docker Desktop）
# 访问：http://localhost:3100
#   首次打开注册账号 → 建 Organization / Project →
#   Project Settings → API Keys 创建 pk/sk → 写入 minicare-agent/.env.local：
#     LANGFUSE_HOST=http://localhost:3100
#     LANGFUSE_PUBLIC_KEY=pk-lf-...
#     LANGFUSE_SECRET_KEY=sk-lf-...
# 导入：node ../scripts/langfuse-import.mjs
#
# 注意：web 映射到宿主 3100，避开 minicare-agent 本地服务的 3000。

services:
  langfuse-web:
    image: langfuse/langfuse:3
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/postgres
      NEXTAUTH_SECRET: lf-local-7f3a9c1e2b84d05a6e9f3c7b1d8a4e2f9c0b5d7a3e6f1c8b4d9a2e7f5c0b3d6a
      SALT: lf-local-2c9e4f7a1b3d5e8c0a2f4b6d8e0a3c5b7d9f1a3c5e7b9d0f2a4c6e8b0d3f5a7c
      ENCRYPTION_KEY: bf4d8a2c6e0b9d3f5a7c1e8b4d0a6c2e9f5b3d7a1c8e4f0b6d2a8e5c9f1b3d7a
      # 局域网访问（手机）——Mac IP 变化时需同步修改并重建容器
      NEXTAUTH_URL: http://192.168.1.16:3100
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000/default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/postgres
      NEXTAUTH_SECRET: lf-local-7f3a9c1e2b84d05a6e9f3c7b1d8a4e2f9c0b5d7a3e6f1c8b4d9a2e7f5c0b3d6a
      SALT: lf-local-2c9e4f7a1b3d5e8c0a2f4b6d8e0a3c5b7d9f1a3c5e7b9d0f2a4c6e8b0d3f5a7c
      ENCRYPTION_KEY: bf4d8a2c6e0b9d3f5a7c1e8b4d0a6c2e9f5b3d7a1c8e4f0b6d2a8e5c9f1b3d7a
      NEXTAUTH_URL: http://localhost:3100
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000/default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://langfuse-redis:6379
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse-media
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniopassword
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    depends_on:
      langfuse-db:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
    restart: unless-stopped

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_ch:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-redis:
    image: redis:7
    volumes:
      - langfuse_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniopassword
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  langfuse-minio-init:
    image: minio/mc
    depends_on:
      langfuse-minio:
        condition: service_healthy
    # ⚠️ Docker Desktop 会向容器注入 HTTP_PROXY=127.0.0.1:7890（宿主代理），
    # 容器内不可达 → alias 创建失败、bucket 建不成。这里显式清空代理变量。
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://langfuse-minio:9000 minio miniopassword;
      mc mb myminio/langfuse --ignore-existing;
      mc mb myminio/langfuse-media --ignore-existing;
      exit 0;
      "

volumes:
  langfuse_pg:
  langfuse_ch:
  langfuse_redis:
  langfuse_minio:
