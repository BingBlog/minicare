<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>敏宝日记 · 表现记录</title>
  <link rel="stylesheet" href="common.css"/>
  <style>
    .section-card {
      margin: 0 16px 12px;
      background: var(--card-bg); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .sc-sub-title {
      font-size: 13px; font-weight: 700; color: #7A5A60;
      padding: 14px 16px 4px; border-bottom: .5px solid var(--gray-100);
      display: flex; align-items: center; gap: 8px;
    }
    .sc-sub-title svg.icon { width:16px; height:16px; }

    /* Mood / Spirit */
    .mood-row { display: flex; gap: 8px; padding: 10px 16px 14px; }
    .mood-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 4px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--gray-200); cursor: pointer; transition: all .15s;
    }
    .mood-btn.selected { border-color: var(--primary); background: var(--primary-lt); }
    .mood-btn .mb-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .mood-btn .mb-label { font-size: 11px; color: var(--sub-text); font-weight: 500; }
    .mood-btn.selected .mb-label { color: var(--primary); font-weight: 600; }
    .mood-btn:active { transform: scale(.93); }
  </style>
</head>
<body>
<div class="phone">
  <div class="notch"><div class="notch-pill"></div></div>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 12"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="4.5" y="4" width="3" height="8" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-back" onclick="nav('home.html')">←</button>
    <span class="nav-title">表现记录</span>
    <span class="nav-action"></span>
  </div>

  <div class="scroll-area">

    <!-- Time -->
    <div class="form-section-title" style="padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--sub-text)">记录时间</div>
    <div class="form-section">
      <div class="form-row">
        <span class="form-label">记录时间</span>
        <input class="form-input" type="time" value="09:41"/>
      </div>
    </div>

    <!-- Mood -->
    <div class="section-card">
      <div class="sc-sub-title">
        <svg class="icon" style="color:#F0B8C8" viewBox="0 0 24 24"><use href="#icon-smile"></use></svg>
        心情状态
      </div>
      <div class="mood-row">
        <div class="mood-btn selected" onclick="selectMood(this)"><div class="mb-icon" style="background:#E8F5E9"><svg style="width:20px;height:20px;fill:none;stroke:#4CAF82;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-laugh"/></svg></div><div class="mb-label">开心</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:var(--gray-100)"><svg style="width:20px;height:20px;fill:none;stroke:var(--sub-text);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-smile"/></svg></div><div class="mb-label">一般</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF0F4"><svg style="width:20px;height:20px;fill:none;stroke:var(--primary);stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-frown"/></svg></div><div class="mb-label">低落</div></div>
      </div>
    </div>

    <!-- Spirit -->
    <div class="section-card">
      <div class="sc-sub-title">
        <svg class="icon" style="color:#DDB870" viewBox="0 0 24 24"><use href="#icon-star"></use></svg>
        精神状态
      </div>
      <div class="mood-row">
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#E8F5E9"><svg style="width:20px;height:20px;fill:none;stroke:#4CAF82;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-pause"/></svg></div><div class="mb-label">安静</div></div>
        <div class="mood-btn selected" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF8E6"><svg style="width:20px;height:20px;fill:none;stroke:#DDB870;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-play"/></svg></div><div class="mb-label">正常</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF0F4"><svg style="width:20px;height:20px;fill:none;stroke:#F87098;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-trending-up"/></svg></div><div class="mb-label">活跃</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#7B68EE20"><svg style="width:20px;height:20px;fill:none;stroke:#7B68EE;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-moon"/></svg></div><div class="mb-label">嗜睡</div></div>
      </div>
    </div>

    <!-- Note -->
    <div class="form-section-title" style="padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--sub-text)">备注（可选）</div>
    <div class="form-section">
      <div class="form-row">
        <input class="form-input" placeholder="其他观察或备注…" style="text-align:left"/>
      </div>
    </div>

    <div class="h-16"></div>
    <button class="btn-primary" onclick="saveRecord()">保存记录</button>
    <button class="btn-secondary" onclick="nav('home.html')">取消</button>
    <div class="h-60"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  function nav(p) { window.location.href = p; }

  function selectMood(el) {
    el.closest('.mood-row').querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
  }

  function saveRecord() {
    showToast('✓ 表现记录已保存');
    setTimeout(() => nav('home.html'), 1600);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
  <script src="icons-sprite.js"></script>
</body>
</html>
