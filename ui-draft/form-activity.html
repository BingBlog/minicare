<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>敏宝日记 · 活动记录</title>
  <link rel="stylesheet" href="common.css"/>
  <style>
    .section-card {
      margin: 0 16px 12px;
      background: var(--card-bg); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm);
    }
    .sc-sub-title {
      font-size: 13px; font-weight: 700; color: #7A5A60;
      padding: 14px 16px 4px; border-bottom: .5px solid var(--gray-100);
      display: flex; align-items: center; gap: 8px;
    }
    .sc-sub-title svg.icon { width:16px; height:16px; }

    /* Activity Type */
    .mood-row { display: flex; gap: 8px; padding: 10px 16px 14px; }
    .mood-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 10px 4px; border-radius: var(--radius-sm);
      border: 1.5px solid var(--gray-200); cursor: pointer; transition: all .15s;
    }
    .mood-btn.selected { border-color: var(--primary); background: var(--primary-lt); }
    .mood-btn .mb-icon { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
    .mood-btn .mb-label { font-size: 11px; color: var(--sub-text); font-weight: 500; }
    .mood-btn.selected .mb-label { color: var(--primary); font-weight: 600; }
    .mood-btn:active { transform: scale(.93); }

    /* Count badge */
    .count-badge {
      display: inline-flex; align-items: center; gap: 6px; margin-left: 8px;
    }
    .count-btn { width:24px;height:24px;border-radius:50%;border:1.5px solid var(--gray-200);background:var(--card-bg);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .1s; }
    .count-btn:active { background:var(--primary-lt); border-color:var(--primary-md); }
    .count-num { font-size:14px;font-weight:700;color:var(--text);min-width:16px;text-align:center; }

    /* Duration slider */
    .duration-row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
    .duration-btn {
      width: 36px; height: 36px; border-radius: 50%;
      border: 1.5px solid var(--gray-200); background: var(--card-bg);
      font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .duration-btn:active { background: var(--primary-lt); border-color: var(--primary); }
    .duration-display { flex: 1; text-align: center; }
    .duration-val { font-size: 28px; font-weight: 800; color: var(--text); }
    .duration-unit { font-size: 12px; color: var(--sub-text); }
  </style>
</head>
<body>
<div class="phone">
  <div class="notch"><div class="notch-pill"></div></div>
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 12"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="4.5" y="4" width="3" height="8" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".3"/></svg>
      <svg viewBox="0 0 25 12"><rect x="0" y="1" width="22" height="10" rx="3" stroke="currentColor" stroke-width="1.2" fill="none"/><rect x="1.5" y="2.5" width="17" height="7" rx="2" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4z"/></svg>
    </div>
  </div>

  <div class="nav-bar">
    <button class="nav-back" onclick="nav('home.html')">←</button>
    <span class="nav-title">活动记录</span>
    <span class="nav-action"></span>
  </div>

  <div class="scroll-area">

    <!-- Time -->
    <div class="form-section-title" style="padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--sub-text)">记录时间</div>
    <div class="form-section">
      <div class="form-row">
        <span class="form-label">记录时间</span>
        <input class="form-input" type="time" value="09:41"/>
      </div>
    </div>

    <!-- Activity Type -->
    <div class="section-card">
      <div class="sc-sub-title">
        <svg class="icon" style="color:#DDB870" viewBox="0 0 24 24"><use href="#icon-activity"></use></svg>
        活动类型
      </div>
      <div class="mood-row">
        <div class="mood-btn selected" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF0F4"><svg style="width:18px;height:18px;fill:none;stroke:#F87098;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-activity"/></svg></div><div class="mb-label">爬走练习</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#EEF6FF"><svg style="width:18px;height:18px;fill:none;stroke:#4A90D9;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-eye"/></svg></div><div class="mb-label">视力活动</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#E8F5E9"><svg style="width:18px;height:18px;fill:none;stroke:#4CAF82;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-droplets"/></svg></div><div class="mb-label">运动活动</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFFDE7"><svg style="width:18px;height:18px;fill:none;stroke:#C0922A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-sun"/></svg></div><div class="mb-label">户外活动</div></div>
      </div>
    </div>

    <!-- Duration -->
    <div class="section-card">
      <div class="sc-sub-title">
        <svg class="icon" style="color:#F0B8C8" viewBox="0 0 24 24"><use href="#icon-timer"></use></svg>
        活动时长
      </div>
      <div class="duration-row">
        <button class="duration-btn" onclick="changeDuration(-5)">−</button>
        <div class="duration-display">
          <div class="duration-val" id="durationVal">15</div>
          <div class="duration-unit">分钟</div>
        </div>
        <button class="duration-btn" onclick="changeDuration(5)">＋</button>
      </div>
    </div>

    <!-- Intensity -->
    <div class="section-card">
      <div class="sc-sub-title">
        <svg class="icon" style="color:#DDB870" viewBox="0 0 24 24"><use href="#icon-star"></use></svg>
        活动强度
      </div>
      <div class="mood-row">
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#E8F5E9"><svg style="width:18px;height:18px;fill:none;stroke:#4CAF82;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-pause"/></svg></div><div class="mb-label">轻松</div></div>
        <div class="mood-btn selected" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF8E6"><svg style="width:18px;height:18px;fill:none;stroke:#DDB870;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-play"/></svg></div><div class="mb-label">适中</div></div>
        <div class="mood-btn" onclick="selectMood(this)"><div class="mb-icon" style="background:#FFF0F4"><svg style="width:18px;height:18px;fill:none;stroke:#F87098;stroke-width:2;stroke-linecap:round;stroke-linejoin:round" viewBox="0 0 24 24"><use href="#icon-trending-up"/></svg></div><div class="mb-label">活跃</div></div>
      </div>
    </div>

    <!-- Note -->
    <div class="form-section-title" style="padding:14px 20px 6px;font-size:12px;font-weight:600;color:var(--sub-text)">备注（可选）</div>
    <div class="form-section">
      <div class="form-row">
        <input class="form-input" placeholder="其他观察或备注…" style="text-align:left"/>
      </div>
    </div>

    <div class="h-16"></div>
    <button class="btn-primary" onclick="saveRecord()">保存记录</button>
    <button class="btn-secondary" onclick="nav('home.html')">取消</button>
    <div class="h-60"></div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
  function nav(p) { window.location.href = p; }

  function selectMood(el) {
    el.closest('.mood-row').querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('selected'));
    el.classList.add('selected');
  }

  let duration = 15;
  function changeDuration(delta) {
    duration = Math.max(5, Math.min(120, duration + delta));
    document.getElementById('durationVal').textContent = duration;
  }

  function saveRecord() {
    showToast('✓ 活动记录已保存');
    setTimeout(() => nav('home.html'), 1600);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  }
</script>
  <script src="icons-sprite.js"></script>
</body>
</html>
