<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>敏宝日记 · 登录</title>
  <link rel="stylesheet" href="common.css"/>
  <style>
    /* ══ 顶部插画区 ══ */
    .login-hero {
      height: 220px;
      background: linear-gradient(180deg, #F87098 0%, #F9A8C0 60%, #FBCAD8 100%);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    /* 太阳 */
    .login-hero-sun {
      position: absolute; top: 30px; left: 28px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(255,255,255,.9);
      box-shadow: 0 0 0 8px rgba(255,255,255,.2);
    }
    /* 云朵 */
    .cloud {
      position: absolute;
      background: rgba(255,255,255,.18);
      border-radius: 50px;
    }
    .cloud::before, .cloud::after {
      content: ''; position: absolute;
      background: rgba(255,255,255,.18); border-radius: 50%;
    }
    /* 地面 */
    .login-hero-ground {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 60px;
      background: rgba(248, 180, 195, 0.5);
      border-radius: 60% 60% 0 0 / 30px 30px 0 0;
    }
    /* 草地 */
    .login-hero-hills {
      position: absolute; bottom: 20px; left: 0; right: 0;
      height: 50px;
      background: rgba(245, 160, 180, 0.4);
      border-radius: 50% 50% 0 0 / 30px 30px 0 0;
    }
    /* 小树 */
    .tree {
      position: absolute; bottom: 28px;
      display: flex; flex-direction: column; align-items: center;
    }
    .tree-crown {
      width: 18px; height: 24px; border-radius: 50%;
      background: rgba(240, 100, 130, 0.7);
    }
    .tree-trunk {
      width: 4px; height: 10px;
      background: rgba(200, 80, 110, 0.5);
    }
    /* 风车 */
    .windmill {
      position: absolute; bottom: 24px; right: 60px;
    }
    .windmill-body {
      width: 16px; height: 30px;
      background: rgba(240, 120, 150, 0.5);
      margin: 0 auto;
      border-radius: 2px;
    }
    .windmill-top {
      width: 20px; height: 14px;
      background: rgba(220, 80, 110, 0.5);
      border-radius: 4px 4px 0 0;
      margin: 0 auto;
    }
    .windmill-roof {
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 10px solid rgba(180, 60, 90, 0.4);
      margin: 0 auto;
    }
    /* 小路 */
    .login-hero-path {
      position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 30px; height: 100px;
      background: linear-gradient(to bottom, rgba(255, 240, 180, 0.6), rgba(255, 220, 120, 0.3));
      border-radius: 50% 50% 0 0 / 20px;
    }

    /* ══ 登录主体 ══ */
    .login-body {
      flex: 1;
      background: #fff;
      padding: 32px 24px 24px;
      overflow-y: auto;
    }

    /* 输入框组 */
    .login-field {
      display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid #F0E8EA;
      padding: 14px 0;
    }
    .login-field-icon {
      width: 22px; height: 22px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .login-field-icon svg {
      width: 20px; height: 20px;
      fill: none; stroke: #F0B8C8; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .login-field input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 15px; color: #4A3035; font-family: var(--font);
    }
    .login-field input::placeholder { color: #C0A8AD; }
    .login-field-extra {
      font-size: 13px; color: #F87098; cursor: pointer; font-weight: 500; flex-shrink: 0;
    }

    /* 发送验证码按钮 */
    .send-code-btn {
      font-size: 13px; color: var(--primary); font-weight: 600;
      cursor: pointer; flex-shrink: 0; padding: 4px 10px;
      border: 1px solid var(--primary); border-radius: 12px;
      background: transparent; font-family: var(--font); transition: all .15s;
    }
    .send-code-btn.sent { color: var(--sub-text); border-color: var(--gray-200); pointer-events: none; }

    /* 主按钮 */
    .login-btn {
      width: 100%; margin-top: 32px;
      padding: 16px; border-radius: 50px;
      background: linear-gradient(90deg, #F87098, #F9A8C0);
      color: #fff; border: none;
      font-size: 16px; font-weight: 700; cursor: pointer; font-family: var(--font);
      box-shadow: 0 6px 20px rgba(248, 112, 152, 0.4);
      transition: all .15s;
    }
    .login-btn:active { transform: scale(.97); }

    /* 切换 */
    .login-switch {
      text-align: center; margin-top: 20px;
      font-size: 13px; color: var(--sub-text);
    }
    .login-switch-link {
      color: var(--primary); font-weight: 600; cursor: pointer;
    }

    /* 分割线 */
    .login-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 28px 0 20px;
    }
    .login-divider::before, .login-divider::after {
      content: ''; flex: 1; height: 1px; background: #F0E8EA;
    }
    .login-divider-text { font-size: 12px; color: #C0A8AD; white-space: nowrap; }

    /* 协议提示 */
    .login-agreement {
      text-align: center; font-size: 11px; color: var(--sub-text);
      margin-top: 16px; line-height: 1.6;
    }
    .login-agreement a { color: var(--primary); font-weight: 500; }

    /* ══ 模式切换 Tab ══ */
    .login-mode-tabs {
      display: flex; gap: 0; margin-bottom: 24px;
      border-bottom: 1.5px solid #F0E8EA;
    }
    .login-mode-tab {
      flex: 1; text-align: center; padding: 10px; font-size: 15px;
      font-weight: 600; color: var(--sub-text); cursor: pointer;
      border-bottom: 2.5px solid transparent; margin-bottom: -1.5px; transition: all .2s;
    }
    .login-mode-tab.active {
      color: var(--primary); border-bottom-color: var(--primary);
    }
  </style>
</head>
<body>
<div class="phone">
  <div class="notch"><div class="notch-pill"></div></div>

  <!-- Status Bar -->
  <div class="status-bar" style="background: transparent; position:absolute; top:0; left:0; right:0; z-index:10">
    <span class="status-time" style="color:#fff">9:41</span>
    <div class="status-icons">
      <svg viewBox="0 0 17 12" style="fill:#fff;width:16px;height:16px"><rect x="0" y="6" width="3" height="6" rx="1"/><rect x="4.5" y="4" width="3" height="8" rx="1"/><rect x="9" y="2" width="3" height="10" rx="1"/><rect x="13.5" y="0" width="3" height="12" rx="1" opacity=".45"/></svg>
      <svg viewBox="0 0 16 12" style="fill:#fff;width:16px;height:16px"><path d="M8 10a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm0-3.5a4.5 4.5 0 0 1 3.18 1.32l1.06-1.06A6 6 0 0 0 8 5a6 6 0 0 0-4.24 1.76l1.06 1.06A4.5 4.5 0 0 1 8 6.5zm0-3.5a7.5 7.5 0 0 1 5.3 2.2l1.06-1.06A9 9 0 0 0 8 1a9 9 0 0 0-6.36 2.64l1.06 1.06A7.5 7.5 0 0 1 8 3z"/></svg>
      <svg viewBox="0 0 25 12" style="fill:none;stroke:#fff;stroke-width:1.2;width:20px;height:14px"><rect x="0" y="1" width="22" height="10" rx="3"/><rect x="1.5" y="2.5" width="17" height="7" rx="2" fill="#fff" stroke="none"/><path d="M23 4v4a2 2 0 0 0 0-4z" fill="#fff" stroke="none"/></svg>
    </div>
  </div>

  <!-- 顶部插画区 -->
  <div class="login-hero">
    <div class="login-hero-sun"></div>
    <!-- 云朵1 -->
    <div class="cloud" style="width:60px;height:18px;top:50px;right:40px"></div>
    <div class="cloud" style="width:80px;height:22px;top:42px;right:20px"></div>
    <!-- 云朵2 -->
    <div class="cloud" style="width:45px;height:15px;top:80px;left:80px"></div>
    <!-- 小路 -->
    <div class="login-hero-path"></div>
    <!-- 丘陵 -->
    <div class="login-hero-hills"></div>
    <div class="login-hero-ground"></div>
    <!-- 小树 -->
    <div class="tree" style="left:22px">
      <div class="tree-crown"></div>
      <div class="tree-trunk"></div>
    </div>
    <div class="tree" style="left:42px;bottom:32px">
      <div class="tree-crown" style="width:14px;height:18px"></div>
      <div class="tree-trunk" style="height:8px"></div>
    </div>
    <!-- 风车 -->
    <div class="windmill">
      <div class="windmill-roof"></div>
      <div class="windmill-top"></div>
      <div class="windmill-body"></div>
    </div>
    <!-- 标题区 -->
    <div style="position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:40px 20px 0">
      <div style="font-size:18px;font-weight:700;color:#fff">登录</div>
      <div style="font-size:14px;color:rgba(255,255,255,.9);cursor:pointer;font-weight:500" onclick="switchToRegister()">注册</div>
    </div>
  </div>

  <!-- 主体 -->
  <div class="login-body">

    <!-- 模式切换 Tab -->
    <div class="login-mode-tabs">
      <div class="login-mode-tab active" id="tab-sms" onclick="switchMode('sms')">验证码登录</div>
      <div class="login-mode-tab" id="tab-pwd" onclick="switchMode('pwd')">密码登录</div>
    </div>

    <!-- 验证码模式 -->
    <div id="panel-sms">
      <div class="login-field">
        <div class="login-field-icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        </div>
        <input type="tel" id="phoneInput" placeholder="请输入手机号" maxlength="11" oninput="checkPhone()"/>
      </div>
      <div class="login-field">
        <div class="login-field-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input type="number" placeholder="请输入验证码" maxlength="6" style="letter-spacing:4px"/>
        <button class="send-code-btn" id="sendCodeBtn" onclick="sendCode()">获取验证码</button>
      </div>
      <button class="login-btn" onclick="doLogin()">登录 / 注册</button>
      <div class="login-agreement">
        登录即代表同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
      </div>
    </div>

    <!-- 密码模式 -->
    <div id="panel-pwd" style="display:none">
      <div class="login-field">
        <div class="login-field-icon">
          <svg viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        </div>
        <input type="tel" placeholder="请输入手机号" maxlength="11"/>
      </div>
      <div class="login-field">
        <div class="login-field-icon">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input type="password" placeholder="请输入密码"/>
        <span class="login-field-extra" onclick="showToast('忘记密码 - 通过手机号重置')">忘记密码?</span>
      </div>
      <button class="login-btn" onclick="doLogin()">登录</button>
      <div class="login-switch">
        没有账号？<span class="login-switch-link" onclick="switchToRegister()">立即注册</span>
      </div>
      <div class="login-agreement">
        登录即代表同意 <a href="#">《用户协议》</a> 和 <a href="#">《隐私政策》</a>
      </div>
    </div>

  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="icons-sprite.js"></script>
<script>
  function nav(p) { window.location.href = p; }

  function switchMode(mode) {
    ['sms','pwd'].forEach(m => {
      document.getElementById('tab-' + m).classList.toggle('active', m === mode);
      document.getElementById('panel-' + m).style.display = m === mode ? '' : 'none';
    });
  }

  function switchToRegister() {
    switchMode('sms');
    showToast('手机号验证码即可注册或登录');
  }

  let codeTimer = null;
  function sendCode() {
    const phone = document.getElementById('phoneInput').value;
    if (phone.length !== 11) { showToast('请输入正确的手机号'); return; }
    const btn = document.getElementById('sendCodeBtn');
    btn.classList.add('sent');
    let sec = 60;
    btn.textContent = sec + 's 后重发';
    codeTimer = setInterval(() => {
      sec--;
      btn.textContent = sec + 's 后重发';
      if (sec <= 0) {
        clearInterval(codeTimer);
        btn.classList.remove('sent');
        btn.textContent = '重新获取';
      }
    }, 1000);
    showToast('验证码已发送至 ' + phone);
  }

  function checkPhone() {
    // 实时校验手机号格式
  }

  function doLogin() {
    showToast('正在登录…');
    setTimeout(() => { nav('onboarding.html'); }, 1200);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
</script>
</body>
</html>
