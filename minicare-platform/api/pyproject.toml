[project]
name = "minicare-platform-api"
version = "0.2.0"
description = "敏宝管理平台后端：知识库管线（MinerU 解析 → 自研切块 → 校验 → 入库）+ 平台服务"
# 开发与验证环境固定 Python 3.13（TECH-015 §9.3）；>=3.11 为兼容下限
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pymysql>=1.1",
    "PyYAML>=6.0",
    # 「全局配置」页写回 pipeline.yaml 用（往返保留注释与排版；PyYAML 的 dump 会丢注释）
    "ruamel.yaml>=0.18",
    # 「检索质检 → 用例集」的 Excel 通道：模板下载 / 导出当前用例集 / 上传导入
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# LlamaIndex 切块为**备选路径**（默认不装）：`kb-pipeline chunk --splitter llama` 需要它。
# 生产路径是自研切块（chunking/pipeline.py），已实测 Recall 更优且零运行时依赖 —— 见
# docs/CHUNKING-COMPARE-REPORT.md 与 TECH-015 §4.2。
splitter-llama = [
    "llama-index-core>=0.14",
]
# 本地 Web 层 v0（`kb-pipeline serve`）：无构建单页 + REST，用于在浏览器里看六步状态与跑 dry-run
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
# 页面栅格化（US-14「原文对照」的 bbox 高亮）：pypdfium2 与 MinerU 同源（同一套 pdfium），
# 渲染口径一致。仅对照页需要，故独立成 extra，不装也不影响其余功能（会退化为"无页面图"）。
render = [
    "pypdfium2>=5.10.1,<6",
]

[project.scripts]
kb-pipeline = "kb_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入惯用法：`payload: dict = Body(...)` 必须在参数默认值里调用 Body，
# 这不是 B008 想防的"可变默认值陷阱"，而是框架契约。
"src/kb_pipeline/web/api.py" = ["B008"]
"src/kb_pipeline/web/routers.py" = ["B008"]
