<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 660" width="1520" height="660" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" role="img">
<title>知识库解析入库流水线端到端主干流程（泳道图）</title>
<desc>用户与系统双泳道、六阶段横向主流程，只画正常路径，两个人工暂停点突出显示，异常回路见 PRD 分支规则表</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="760" y="38" text-anchor="middle" font-size="24" font-weight="600" fill="#2C2C2A">知识库解析入库流水线 · 端到端主干流程（泳道图）</text>
<text x="760" y="60" text-anchor="middle" font-size="13" fill="#5F5E5A">用户 / 系统双泳道 × 六阶段 · 主干只画正常路径，异常回路见分支规则表（B1–B12）</text>

<g>
<rect x="40" y="72" width="350" height="30" rx="6" fill="#F1EFE8"/>
<text x="215" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">阶段一 · 接入与预检</text>
<rect x="410" y="72" width="350" height="30" rx="6" fill="#F1EFE8"/>
<text x="585" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">阶段二 · 解析与归一化</text>
<rect x="780" y="72" width="170" height="30" rx="6" fill="#F1EFE8"/>
<text x="865" y="92" text-anchor="middle" font-size="14" font-weight="600" fill="#444441">阶段三 · 元信息确认</text>
<rect x="970" y="72" width="150" height="30" rx="6" fill="#F1EFE8"/>
<text x="1045" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">阶段四 · 内容加工</text>
<rect x="1140" y="72" width="160" height="30" rx="6" fill="#F1EFE8"/>
<text x="1220" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">阶段五 · 切片校对</text>
<rect x="1320" y="72" width="160" height="30" rx="6" fill="#F1EFE8"/>
<text x="1400" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">阶段六 · 入库使用</text>
</g>

<rect x="40" y="112" width="1440" height="148" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="56" y="132" font-size="16" font-weight="600" fill="#633806">用户</text>
<rect x="40" y="288" width="1440" height="252" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="56" y="308" font-size="16" font-weight="600" fill="#0C447C">系统</text>

<g>
<rect x="40" y="160" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.75"/>
<text x="120" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#633806" dominant-baseline="central">① 上传 PDF</text>
<text x="120" y="216" text-anchor="middle" font-size="12" fill="#633806" dominant-baseline="central">拖拽 / 多选 ≤ 100MB</text>

<rect x="770" y="160" width="190" height="80" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text x="865" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13" dominant-baseline="central">⑫ 暂停点 1 · 元信息确认</text>
<text x="865" y="212" text-anchor="middle" font-size="12" fill="#712B13" dominant-baseline="central">表单核对，字段级修正不重解析</text>

<rect x="1125" y="160" width="190" height="80" rx="8" fill="#F5C4B3" stroke="#993C1D" stroke-width="1.5"/>
<text x="1220" y="186" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13" dominant-baseline="central">⑱ 暂停点 2 · 切片校对</text>
<text x="1220" y="212" text-anchor="middle" font-size="12" fill="#712B13" dominant-baseline="central">编辑 / 拆分 / 合并 / 局部重切</text>

<rect x="1320" y="160" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="0.75"/>
<text x="1400" y="192" text-anchor="middle" font-size="14" font-weight="600" fill="#633806" dominant-baseline="central">㉑ 检索验证 · 导出 MD</text>
<text x="1400" y="216" text-anchor="middle" font-size="12" fill="#633806" dominant-baseline="central">㉒ 发现切错 → 回退 ⑱</text>
</g>

<g>
<rect x="40" y="400" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="120" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">② ingest 判重</text>
<text x="120" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">③ 重复 → 提示已存在</text>

<rect x="220" y="400" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="305" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑤ preflight 预检</text>
<text x="305" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">⑥ 扫描页 · ⑧ 定档</text>

<rect x="410" y="400" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="490" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑦ parse 解析</text>
<text x="490" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">⑧⑨ 失败降级 fast</text>

<rect x="590" y="400" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="675" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑩ normalize 归一化</text>
<text x="675" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">块模型 + capabilities</text>

<rect x="780" y="400" width="170" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="865" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑪ extract_meta</text>
<text x="865" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">规则 → API → LLM 兜底</text>

<rect x="970" y="400" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="1045" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑬ 图片 ∥ ⑭ 表格</text>
<text x="1045" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">⑮⑯ 低置信 · 非阻断</text>

<rect x="1140" y="400" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="1220" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑰ segment 切片</text>
<text x="1220" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">需 ⑫ 确认 ∧ ⑬⑭ 完成</text>

<rect x="1320" y="400" width="160" height="80" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="0.75"/>
<text x="1400" y="428" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C" dominant-baseline="central">⑲ index 入库</text>
<text x="1400" y="454" text-anchor="middle" font-size="12" fill="#0C447C" dominant-baseline="central">⑳ 向量 + BM25 可检索</text>
</g>

<g stroke="#5F5E5A" stroke-width="1.75" fill="none">
<path d="M120,240 L120,396" marker-end="url(#arrow)"/>
<path d="M200,440 L216,440" marker-end="url(#arrow)"/>
<path d="M390,440 L406,440" marker-end="url(#arrow)"/>
<path d="M570,440 L586,440" marker-end="url(#arrow)"/>
<path d="M760,440 L776,440" marker-end="url(#arrow)"/>
<path d="M865,396 L865,244" marker-end="url(#arrow)"/>
<path d="M950,440 L966,440" marker-end="url(#arrow)"/>
<path d="M1120,440 L1136,440" marker-end="url(#arrow)"/>
<path d="M1250,396 L1250,244" marker-end="url(#arrow)"/>
<path d="M1430,396 L1430,244" marker-end="url(#arrow)"/>
</g>
<g stroke="#5F5E5A" stroke-width="1.75" fill="none" stroke-dasharray="6 4">
</g>
<g stroke="#993C1D" stroke-width="1.75" fill="none" stroke-dasharray="6 4">
<path d="M930,240 L930,340 L1190,340 L1190,396" marker-end="url(#arrow)"/>
<path d="M1280,240 L1280,360 L1370,360 L1370,396" marker-end="url(#arrow)"/>
</g>

<text x="873" y="325" font-size="12" fill="#5F5E5A">待确认</text>
<text x="958" y="428" font-size="12" fill="#5F5E5A">并行</text>
<text x="1042" y="332" font-size="12" fill="#993C1D">确认放行</text>
<text x="1258" y="325" font-size="12" fill="#5F5E5A">待校对</text>
<text x="1290" y="352" font-size="12" fill="#993C1D">通过</text>
<text x="1438" y="325" font-size="12" fill="#5F5E5A">可检索</text>

<text x="40" y="576" font-size="13" fill="#444441">图例：实线 = 主数据流 · 珊瑚色虚线 = 人工控制流（确认放行 / 通过）· 珊瑚色节点 = 人工暂停点（⑫ / ⑱）· ⑬ ∥ ⑭ 表示与 ⑫ 确认并行执行</text>
<text x="40" y="600" font-size="13" fill="#444441">主干只画正常路径，异常回路不在图中：B3 解析失败降级/重试 · B5 字段修正 · B6 整体退回重解析 · B7/B8 低置信标记 · B10 局部重切 · B12 回退校对 —— 详见下方分支规则表</text>
<text x="40" y="624" font-size="13" fill="#5F5E5A">节点编号 ①–㉒ 与节点说明表一一对应；本图为 SVG 矢量图，可无损放大（高清 PNG 见同目录 flow-swimlane.png）</text>
</svg>
